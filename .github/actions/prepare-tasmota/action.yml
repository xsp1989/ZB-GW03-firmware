name: Prepare Tasmota build
description: Clone the requested Tasmota tag, apply the ZB-GW03 overrides and set up PlatformIO Core

inputs:
  tag:
    description: Tasmota tag (e.g. v16.0.0)
    required: true
  repo:
    description: Tasmota repository
    required: false
    default: arendst/Tasmota

runs:
  using: composite
  steps:
    - name: Clone Tasmota ${{ inputs.tag }}
      shell: bash
      run: |
        set -euo pipefail
        rm -rf Tasmota
        git clone --depth 1 --branch "${{ inputs.tag }}" \
          "https://github.com/${{ inputs.repo }}.git" Tasmota

    - name: Apply ZB-GW03 overrides
      shell: bash
      run: |
        set -euo pipefail
        cp tasmota/platformio_override.ini Tasmota/platformio_override.ini
        cp tasmota/user_config_override.h Tasmota/user_config_override.h

    # PlatformIO Core in its own virtual environment, exactly as described in
    # https://tasmota.github.io/docs/Create-your-own-Firmware-Build-without-IDE/
    #   virtualenv platformio-core && cd platformio-core && pip install -U platformio
    # No version is pinned here: the newest released Core is installed, which is
    # what the Tasmota ESP32 platform expects. `python -m venv` is used instead of
    # the `virtualenv` package because it ships with the runner's Python.
    # littlefs-python is required by Tasmota's pio-tools/post_esp32.py.
    - name: Set up PlatformIO Core
      shell: bash
      run: |
        set -euo pipefail
        CORE_ENV="${RUNNER_TEMP:-$HOME}/platformio-core"
        rm -rf "${CORE_ENV}"
        python -m venv "${CORE_ENV}"
        echo "${CORE_ENV}/bin" >> "${GITHUB_PATH}"
        "${CORE_ENV}/bin/python" -m pip install --upgrade --retries 5 --timeout 60 pip
        "${CORE_ENV}/bin/python" -m pip install --upgrade --retries 5 --timeout 60 \
          platformio littlefs-python
        "${CORE_ENV}/bin/pio" --version
