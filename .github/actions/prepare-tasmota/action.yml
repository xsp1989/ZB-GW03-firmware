name: Prepare Tasmota build
description: Clone the requested Tasmota tag, apply the ZB-GW03 overrides and set up PlatformIO Core

inputs:
  tag:
    description: Tasmota tag (e.g. v16.0.0)
    required: true
  repo:
    description: Tasmota repository
    required: false
    default: arendst/Tasmota

runs:
  using: composite
  steps:
    # PlatformIO Core in its own virtual environment, following
    # https://tasmota.github.io/docs/Create-your-own-Firmware-Build-without-IDE/
    #   sudo yum install -y python python-virtualenv python-pip
    #   sudo pip install --upgrade pip
    #   virtualenv platformio-core
    #   cd platformio-core
    #   pip install -U platformio
    # The runner is Ubuntu, so the yum packages are installed with the apt
    # equivalents. littlefs-python is added because Tasmota's
    # pio-tools/post_esp32.py imports it.
    - name: Set up PlatformIO Core
      shell: bash
      run: |
        set -eo pipefail

        sudo apt-get update -qq
        sudo apt-get install -y -qq python3 python3-pip python3-virtualenv

        # optional per the docs: the virtualenv gets its own pip upgraded below
        sudo python3 -m pip install --upgrade pip --break-system-packages || true

        cd "${RUNNER_TEMP:-$HOME}"
        rm -rf platformio-core
        # -p python3 keeps the interpreter pinned by actions/setup-python
        virtualenv -p python3 platformio-core
        cd platformio-core
        . bin/activate

        pip install -U pip
        pip install -U platformio littlefs-python
        pio --version

        # keep the environment active for the following steps
        echo "${VIRTUAL_ENV}/bin" >> "${GITHUB_PATH}"

    - name: Clone Tasmota ${{ inputs.tag }}
      shell: bash
      run: |
        set -euo pipefail
        rm -rf Tasmota
        git clone --depth 1 --branch "${{ inputs.tag }}" \
          "https://github.com/${{ inputs.repo }}.git" Tasmota

    - name: Apply ZB-GW03 overrides
      shell: bash
      run: |
        set -euo pipefail
        cp tasmota/platformio_override.ini Tasmota/platformio_override.ini
        cp tasmota/user_config_override.h Tasmota/user_config_override.h
